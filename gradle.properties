# org.gradle.java.home=C:\\Path\\To\\Your\\JDK-17  # Set per-machine; see CLAUDE.md
# -Xmx3072m is the WIN runner's documented memory budget
# (CI runner ships 8 GiB; -Xmx4g OOMs the daemon; -Xmx2g hits the GC
# ceiling during R8 + Lint + native-build phases).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.nonFinalResIds=true