# org.gradle.java.home=C:\\Path\\To\\Your\\JDK-17  # Set per-machine; see CLAUDE.md
# -Xmx3072m is the WIN runner's documented memory budget
# (CI runner ships 8 GiB; -Xmx4g OOMs the daemon; -Xmx2g hits the GC
# ceiling during R8 + Lint + native-build phases).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Toolchain: buildSrc pins jvmToolchain(17) but WIN runner ships JDK 25 only.
# 实际没有 foojay-resolver-convention plugin,auto-download 不可用 — 必须在构建前手动
# `export JAVA_HOME=...jdk-17.0.18+8` 指向 pre-staged JDK 17(见 CLAUDE.md §开发环境)。
# 故此处不写 auto-download / auto-detect flag(纯注释噪音,会让 Gradle 启动时报
# "could not resolve toolchain";真正的工具链解析靠用户 export 的 JAVA_HOME)。