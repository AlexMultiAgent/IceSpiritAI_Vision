name: Android CI

on:
  push:
    branches: [ main, "feature/**", "update/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble (shell profile)
        run: ./gradlew assembleDebug -PmodelProfile=shell --no-daemon

      - name: Unit tests (shell profile)
        run: ./gradlew testDebugUnitTest -PmodelProfile=shell --no-daemon

      # A5 follow-up: also compile (but don't run) under `ice_ocr_rules`
      # so PaddleOcrEngine and friends get hit at every PR — without this,
      # those classes only get compiled on release day. Skips the full APK
      # build because that needs ONNX models the CI runner doesn't have
      # (downloaded by `tools/download-ppocr-models.sh`, gitignored).
      - name: Compile + unit tests (ice_ocr_rules profile)
        run: ./gradlew compileDebugSources compileDebugUnitTestKotlin -PmodelProfile=ice_ocr_rules --no-daemon

      # Lint gate (shell profile). The 44 issue-ids disabled in app/lint.xml
      # (GradleDetector / CommentDetector / AppBundleLocaleChangesDetector /
      # ByteOrderMarkDetector) sidestep the AGP 9.3 + Kotlin 2.4.10 FIR crash
      # on `.gradle.kts` — see docs/knowledge/lint-vital-fir-crash.md. With
      # those skip-listed, `lintDebug` runs cleanly and acts as the PR-time
      # gate for everything else (UnusedAttribute, MissingClass, etc.).
      - name: Lint (shell profile)
        run: ./gradlew lintDebug -PmodelProfile=shell --no-daemon
