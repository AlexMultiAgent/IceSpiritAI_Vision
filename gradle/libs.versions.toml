# Version catalog — IceSpiritAI_Vision.
# Forward path baseline (2026-08): AGP 9.3 / Gradle 9.7 / Kotlin 2.4.10 / compileSdk 36.

[versions]
agp = "9.3.0"
kotlin = "2.4.10"
coreKtx = "1.13.1"
appcompat = "1.7.0"
material = "1.12.0"
activityKtx = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.08.00"
composeCompiler = "2.4.10"  # matches Kotlin
coroutines = "1.10.2"
serialization = "1.9.0"
hankcsAc = "1.2.3"
onnxruntime = "1.21.1"
opencv = "4.10.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.13"
androidxArchCoreTesting = "2.2.0"
androidxTestCore = "1.6.1"
exifinterface = "1.3.7"
coil = "2.7.0"
datastore = "1.1.1"
navigation = "2.8.0"
materialIconsExtended = "1.7.0"
telephoto = "0.13.0"  # verify latest compatible version with Compose BOM 2026.08.00

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
# androidx-activity-ktx was declared but never referenced — activity-compose
# (which still uses the same `activityKtx` version) provides all we need.
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
# compose-ui-tooling-preview was wired up but no @Preview annotations exist in
# the codebase; remove until one is needed.
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityKtx" }

# Kotlin
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Domain
hankcs-aho-corasick = { module = "com.hankcs:aho-corasick-double-array-trie", version.ref = "hankcsAc" }

# OCR engine deps (PaddleOCR SDK + native libs)
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
# Phase 2 / Task 4 hotfix: com.quickbirdstudios:opencv:4.5.3 ships native libs
# built with NDK r21 (Sept 2020). With the project's locked NDK 28.2.13676358
# (2026-08 stack), ld on Android 14/15 cannot resolve libc++ ABI symbols
# (e.g. `__sfp_handle_exceptions`) that NDK-r21 libopencv_java4.so references
# but the newer libc++_shared.so no longer exports. 4.10.0 ships libs built
# with a newer NDK and resolves cleanly. Same `org.opencv.android.OpenCVLoader`
# package, same `initDebug()` API — no source change needed.
opencv-android = { module = "org.opencv:opencv", version.ref = "opencv" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxJunit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
# Espresso is required by androidTest/.../IceSpiritVisionActivityTest.kt
# (`homeScreen_opensAndShowsCapture`) which launches the activity via
# ActivityScenario and matches UI with `onView(withText(...))`. Espresso on
# Compose works because `compose.ui.test.junit4` adds the
# `ComposeViewActionInterop` runtime hook that bridges Espresso's view tree
# into Compose semantics.
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "androidxArchCoreTesting" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

# Image loading
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# Zoomable image viewer (pinch / pan / double-tap)
telephoto-zoomable-image-coil = { module = "me.saket.telephoto:zoomable-image-coil", version.ref = "telephoto" }

# Persistence
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# Navigation
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# Icons
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }